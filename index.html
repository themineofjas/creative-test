<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Framework Diagnostic</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .test-container {
      width: 100%;
      max-width: 700px;
    }

    .card {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      transition: all 0.3s ease;
    }

    .hide { display: none !important; }

    .btn-main {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-main:hover { background-color: #2563eb; }

    .progress-bar-container {
      background-color: #475569;
      border-radius: 10px;
      height: 8px;
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-bar {
      background-color: #10b981;
      height: 100%;
      width: 0%;
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .timer-display {
      font-size: 1.5rem;
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 30px;
    }

    .pairing-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 30px;
    }

    .choice-box {
      background-color: #334155;
      color: #f8fafc;
      border: 2px solid #475569;
      border-radius: 12px;
      padding: 24px;
      font-size: 1.1rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      line-height: 1.5;
    }

    .choice-box:hover {
      background-color: #475569;
      border-color: #3b82f6;
    }

    .vs-divider {
      font-weight: bold;
      color: #94a3b8;
    }

    /* Profiles Layout */
    .profile-title { color: #10b981; font-size: 2rem; margin-bottom: 5px; }
    .profile-sub { color: #94a3b8; font-style: italic; margin-bottom: 25px; }
    .section-title { text-align: left; color: #3b82f6; border-bottom: 1px solid #334155; padding-bottom: 5px; margin-top: 25px; }
    .profile-text { text-align: left; line-height: 1.6; color: #cbd5e1; }

    @media (min-width: 600px) {
      .pairing-container { display: flex; flex-direction: row; align-items: center; }
      .choice-box { flex: 1; min-height: 140px; }
    }
  </style>
</head>
<body>

<div class="test-container">
  <!-- WELCOME SCREEN -->
  <div id="welcome-screen" class="card active">
    <h1>Creative Framework Diagnostic</h1>
    <p>Inspired by Barbara Sher's Success Teams. Discover your natural role within a creative ecosystem. This deep 15-to-20 minute assessment will give you long-term self-awareness.</p>
    <button onclick="startTest()" class="btn-main">Start Assessment</button>
  </div>

  <!-- QUIZ INTERFACE -->
  <div id="quiz-screen" class="card hide">
    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>
    <div id="timer" class="timer-display">⏱️ 00:45</div>
    
    <h2>Which statement describes you more naturally?</h2>
    
    <div class="pairing-container">
      <button onclick="handleAnswer('A')" id="btn-sideA" class="choice-box">Statement A Loading...</button>
      <div class="vs-divider">OR</div>
      <button onclick="handleAnswer('B')" id="btn-sideB" class="choice-box">Statement B Loading...</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="card hide">
    <h1>Your Creative Role Matrix</h1>
    <div id="results-content"></div>
    <button onclick="location.reload()" class="btn-main" style="margin-top:20px;">Retake Test</button>
  </div>
</div>

<script>
// --- DATA: THE 21 JARGON-FREE MATCHUPS ---
const questions = [
  { sA: "I am happiest when daydreaming about unlimited possibilities without rules.", rA: "Ideator", sB: "I am happiest when sorting through a pile of clutter and bringing clean order to it.", rB: "Analyst" },
  { sA: "I prefer to be the voice of the group, getting everyone excited to start.", rA: "Catalyst", sB: "I prefer to quietly put my head down and manually finish the work myself.", rB: "Executor" },
  { sA: "I love smashing completely opposite styles together to create a weird, messy shock.", rA: "Alchemist", sB: "I love preserving traditions and collecting the absolute best examples of a classic.", rB: "Curator" },
  { sA: "When a conversation hits a tense wall, I instinctively check on how everyone feels.", rA: "Advocate", sB: "When a conversation hits a tense wall, I offer a wild, unexpected joke or alternative view.", rB: "Ideator" },
  { sA: "I feel secure when there is a clear, predictable plan or layout to follow.", rA: "Analyst", sB: "I feel secure when I am actively winging it and using my charm to navigate a situation.", rB: "Catalyst" },
  { sA: "I get an absolute thrill from crossing off the final item on a checklist.", rA: "Executor", sB: "I get an absolute thrill from tearing up the plan at the last minute to try a bold experiment.", rB: "Alchemist" },
  { sA: "I am highly sensitive to visual details, aesthetics, or the mood of a room.", rA: "Curator", sB: "I am highly sensitive to changes in a person's body language or vocal tone.", rB: "Advocate" },
  { sA: "I would rather spend an hour inventing an imaginary world or scenario.", rA: "Ideator", sB: "I would rather spend an hour telling a captive room a highly engaging story.", rB: "Catalyst" },
  { sA: "My brain naturally focuses on troubleshooting errors and mapping out constraints.", rA: "Analyst", sB: "My brain naturally focuses on physically putting pieces together until it works.", rB: "Executor" },
  { sA: "I don't mind rattling the cage or causing friction if it forces a breakthrough.", rA: "Alchemist", sB: "I will gladly modify my language to ensure everyone feels comfortable and safe.", rB: "Advocate" },
  { sA: "I excel at filtering the noise to find the absolute diamond in the rough.", rA: "Curator", sB: "I excel at generating a massive volume of choices, even if most are unusable.", rB: "Ideator" },
  { sA: "I am energized by massive, high-energy gatherings with loose connections.", rA: "Catalyst", sB: "I am energized by deep, intimate, one-on-one conversations.", rB: "Advocate" },
  { sA: "I would rather build a rough, working prototype right away, even if it looks ugly.", rA: "Executor", sB: "I would rather spend time reviewing things to ensure the presentation is flawless.", rB: "Curator" },
  { sA: "I respect data, history, and proven logical systems.", rA: "Analyst", sB: "I respect intuition, raw gut feelings, and happy accidents.", rB: "Alchemist" },
  { sA: "I lose interest once the initial concept is figured out.", rA: "Ideator", sB: "I only get interested once the manual building phase actually starts.", rB: "Executor" },
  { sA: "I look at things through a lens of utility, function, and sheer efficiency.", rA: "Analyst", sB: "I look at things through a lens of emotional impact, taste, and timeless beauty.", rB: "Curator" },
  { sA: "I naturally adapt my style to win over whatever crowd I am currently pitching to.", rA: "Catalyst", sB: "I stubbornly stick to my individual style, regardless of what the crowd thinks.", rB: "Alchemist" },
  { sA: "When working, I want to be left completely alone to get into a state of deep flow.", rA: "Executor", sB: "When working, I need to feel emotionally connected and aligned with my team.", rB: "Advocate" },
  { sA: "I solve problems by stepping back, detached, and analyzing the moving parts.", rA: "Analyst", sB: "I solve problems by stepping in, empathetic, and listening to the people.", rB: "Advocate" },
  { sA: "I am focused on the future growth, reach, and outer momentum of a project.", rA: "Catalyst", sB: "I am focused on honoring the deep roots, context, and history of a project.", rB: "Curator" },
  { sA: "I like to build elegant, harmonious ideas that make sense to people.", rA: "Ideator", sB: "I like to challenge lines, cross taboos, and shock the system into paying attention.", rB: "Alchemist" }
];

// --- ROLE TEXT DATA ---
const profiles = {
  Advocate: `
    <h2 class="profile-title">The Advocate</h2>
    <div class="profile-sub">The Heart & Psychological Anchor of the Ecosystem</div>
    <h3 class="section-title">✨ Your Way of Moving Through the World</h3>
    <p class="profile-text">You don't need to be a therapist to hold this space. If your friends instinctively call you when life crashes, or you read room tension instantly—you are an Advocate. Your brain uses perception to decode human needs. Your creativity is bound to empathy. You ensure the humans making a project feel supported and safe.</p>
    <h3 class="section-title">🚀 Your Group Superpowers</h3>
    <p class="profile-text"><b>Incubation Shield:</b> You shelter early, fragile ideas from being crushed by premature criticism.<br><b>Resistance Navigator:</b> You spot creative blocks that are actually hidden fears and help people pass them.</p>
  `,
  Ideator: `
    <h2 class="profile-title">The Ideator</h2>
    <div class="profile-sub">The Spark & Blue-Sky Visionary</div>
    <h3 class="section-title">✨ Your Way of Moving Through the World</h3>
    <p class="profile-text">If your mind naturally skips across a hundred random connections or you see a blank page as a playground—you are an Ideator. You use intellectual curiosity to feed an endless stream of original imagination, completely at peace with the unknown.</p>
    <h3 class="section-title">🚀 Your Group Superpowers</h3>
    <p class="profile-text"><b>Concept Incubator:</b> You excel at generating the seed concepts that give a project its distinct identity.<br><b>Creative Lifeline:</b> When a group gets stuck, you throw out unexpected solutions to break the logjam.</p>
  `,
  Analyst: `
    <h2 class="profile-title">The Analyst</h2>
    <div class="profile-sub">The Structural Anchor & Strategist</div>
    <h3 class="section-title">✨ Your Way of Moving Through the World</h3>
    <p class="profile-text">If you love putting complex layout items together, or intuitively spot logical flaws in plans—you are an Analyst. Your brain naturally strips away emotional noise to focus completely on structural frameworks, precision, and systemic clarity.</p>
    <h3 class="section-title">🚀 Your Group Superpowers</h3>
    <p class="profile-text"><b>Constraint Architect:</b> You deconstruct messy ideas into clear, realistic frameworks and parameters.<br><b>Diagnostic Expert:</b> You can spot a structural error or financial risk weeks before anyone else.</p>
  `,
  Catalyst: `
    <h2 class="profile-title">The Catalyst</h2>
    <div class="profile-sub">The Mobilizer & High-Energy Engine</div>
    <h3 class="section-title">✨ Your Way of Moving Through the World</h3>
    <p class="profile-text">If you get an absolute buzz from sharing an idea with a room full of strangers or naturally coordinate groups—you are a Catalyst. Your world is built on momentum, persuasive connection, and bringing structural concepts out into the light.</p>
    <h3 class="section-title">🚀 Your Group Superpowers</h3>
    <p class="profile-text"><b>External Bridge:</b> You pack collective ideas into stories the public understands.<br><b>Momentum Starter:</b> You bring an infectious enthusiasm that pulls people cleanly out of creative slumps.</p>
  `,
  Executor: `
    <h2 class="profile-title">The Executor</h2>
    <div class="profile-sub">The Finisher & Tangible Builder</div>
    <h3 class="section-title">✨ Your Way of Moving Through the World</h3>
    <p class="profile-text">If you get unmatched dopamine hits from physically checking off a finished task or prefer hands-on reality over endless abstract debate—you are an Executor. You are self-possessed, autonomous, and focused entirely on practical, physical delivery.</p>
    <h3 class="section-title">🚀 Your Group Superpowers</h3>
    <p class="profile-text"><b>Practical Engine:</b> You transform cloud-level dreams into completed physical assets.<br><b>Deadline Keeper:</b> You ensure things remain efficient and actually cross the finish line.</p>
  `,
  Alchemist: `
    <h2 class="profile-title">The Alchemist</h2>
    <div class="profile-sub">The Disruptor & Experimental Maverick</div>
    <h3 class="section-title">✨ Your Way of Moving Through the World</h3>
    <p class="profile-text">If you love smashing opposite styles together or question societal rules simply because "who decided that?"—you are an Alchemist. You use bold risk-taking and non-conformity to inject wild experiments into stale formulas.</p>
    <h3 class="section-title">🚀 Your Group Superpowers</h3>
    <p class="profile-text"><b>Status Quo Breaker:</b> You stop the group from getting comfortable or repetitive.<br><b>Fusion Innovator:</b> Brilliant at blending distant mediums together into entirely unique creative hybrids.</p>
  `,
  Curator: `
    <h2 class="profile-title">The Curator</h2>
    <div class="profile-sub">The Taste Gatekeeper & Archivist</div>
    <h3 class="section-title">✨ Your Way of Moving Through the World</h3>
    <p class="profile-text">If you are the person friends always ask for recommendations, or you feel a physical ache when an environment's visual aesthetic is off—you are a Curator. You hold an internal compass for heritage, quality, and timeless artistic beauty.</p>
    <h3 class="section-title">🚀 Your Group Superpowers</h3>
    <p class="profile-text"><b>Quality Filter:</b> You filter endless noise to pull out the single diamond in the rough.<br><b>Identity Gatekeeper:</b> You make sure everything matches the highest aesthetic standards of your brand.</p>
  `
};

// --- CORE APP ENGINE STATE ---
let currentQuestionIndex = 0;
let scores = { Ideator: 0, Analyst: 0, Catalyst: 0, Executor: 0, Alchemist: 0, Curator: 0, Advocate: 0 };
let timerInterval;
let timeLeft = 45;

function startTest() {
  document.getElementById("welcome-screen").classList.add("hide");
  document.getElementById("quiz-screen").classList.remove("hide");
  loadQuestion();
}

function loadQuestion() {
  if (currentQuestionIndex >= questions.length) {
    showResults();
    return;
  }
  
  let percent = (currentQuestionIndex / questions.length) * 100;
  document.getElementById("progress").style.width = percent + "%";
  
  let q = questions[currentQuestionIndex];
  document.getElementById("btn-sideA").innerHTML = q.sA;
  document.getElementById("btn-sideB").innerHTML = q.sB;
  
  clearInterval(timerInterval);
  timeLeft = 45;
  document.getElementById("timer").innerHTML = `⏱️ 00:${timeLeft}`;
  
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").innerHTML = `⏱️ 00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      currentQuestionIndex++;
      loadQuestion();
    }
  }, 1000);
}

function handleAnswer(choice) {
  clearInterval(timerInterval);
  let q = questions[currentQuestionIndex];
  
  if (choice === 'A') {
    scores[q.rA] += 1;
  } else if (choice === 'B') {
    scores[q.rB] += 1;
  }
  
  currentQuestionIndex++;
  loadQuestion();
}

function showResults() {
  document.getElementById("quiz-screen").classList.add("hide");
  document.getElementById("results-screen").classList.remove("hide");
  
  let sortedRoles = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  let dominantRole = sortedRoles[0];
  
  document.getElementById("results-content").innerHTML = profiles[dominantRole];
}
</script>

</body>
</html>
