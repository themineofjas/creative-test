<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Creative Role Assessment</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="test-container">

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="card active">

      <h1>Creative Role Assessment</h1>

      <p>
        Discover your natural role within a creative ecosystem.
        This quick 5-minute assessment will give you
       self-awareness about what you primarily bring to a creative group.
      </p>

      <button
        onclick="startTest()"
        class="btn-main"
      >
        Start Assessment
      </button>

    </div>


    <!-- QUIZ INTERFACE -->
    <div id="quiz-screen" class="card hide">

      <div class="progress-bar-container">
        <div id="progress" class="progress-bar"></div>
      </div>

      <div id="timer" class="timer-display">
        ⏱️ 00:45
      </div>

      <h2>
        Which statement describes you more naturally?
      </h2>

      <div class="pairing-container">

        <button
          onclick="handleAnswer('A')"
          id="btn-sideA"
          class="choice-box"
        >
          Statement A Loading...
        </button>

        <div class="vs-divider">
          OR
        </div>

        <button
          onclick="handleAnswer('B')"
          id="btn-sideB"
          class="choice-box"
        >
          Statement B Loading...
        </button>

      </div>

    </div>


    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="card hide">

      <h1>Your Creative Role:</h1>

      <div id="results-content"></div>

      <button
        onclick="location.reload()"
        class="btn-main retake-button"
      >
        Retake Test
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>

</html>
